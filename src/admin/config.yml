backend:
  # Production-ready example backend. Replace with your own provider.
  # For GitHub: https://decapcms.org/docs/backends-overview/
  # name: git-gateway
  # repo: "greenpandastudio/neutrino-electron"
  name: test-repo	
  branch: main

# Local development only. Remove or set to false in production.
local_backend: true

media_folder: "../../media/blog"
public_folder: "/content/media/blog"
collections:
  - name: "posts"
    label: "Posts"
    folder: "src/content/posts"
    create: true
    slug: "{{id}}--{{slug}}"
    path: "{{slug}}/index"   # Tells Decap where to write the file
    extension: "md"
    fields:
      - {label: "ID (ULID)", name: "id", widget: "ulid"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string", hint: "URL-friendly version of the title"}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Author", name: "author", widget: "string", required: false}
      - {label: "Image", name: "image", widget: "image", required: false, media_folder: "../../media/blog", public_folder: ""}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Draft", name: "draft", widget: "boolean", default: false}
      - {label: "Aliases", name: "aliases", widget: "list", required: false, hint: "Old URLs to redirect to this post"}
      - {label: "Body", name: "body", widget: "markdown"}