backend:
  name: git-gateway
  branch: main
  # Per sviluppo locale, usa:
  # name: test-repo
  # branch: main

# Configurazione per sviluppo locale
local_backend: true

media_folder: "src/content/media"
public_folder: "/content/media"
collections:
  - name: "posts"
    label: "Posts"
    folder: "src/content/posts"
    create: true
    slug: "{{id}}--{{slug}}"
    fields:
      - {label: "ID (ULID)", name: "id", widget: "string", default: "{{now | date('YYYYMMDDHHmmss')}}"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string", hint: "URL-friendly version of the title"}
      - {label: "Description", name: "description", widget: "text", required: false}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Author", name: "author", widget: "string", required: false}
      - {label: "Image", name: "image", widget: "image", required: false}
      - {label: "Tags", name: "tags", widget: "list", required: false}
      - {label: "Draft", name: "draft", widget: "boolean", default: false}
      - {label: "Aliases", name: "aliases", widget: "list", required: false, hint: "Old URLs to redirect to this post"}
      - {label: "Body", name: "body", widget: "markdown"}