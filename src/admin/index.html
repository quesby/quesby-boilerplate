<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Decap CMS</title>
</head>
<body>
  <div id="nc-root"></div>
  
  <script>
    // Load Decap CMS asynchronously
    (function() {
      var script = document.createElement('script');
      script.src = 'https://unpkg.com/decap-cms@3.8.3/dist/decap-cms.js';
      script.async = true;
      
      script.onload = function() {
        // Load ULID widget after Decap CMS is loaded
        var ulidScript = document.createElement('script');
        ulidScript.src = './ulid-widget.js';
        ulidScript.async = true;
        
        ulidScript.onload = function() {
          // Wait a bit more to ensure everything is ready
          setTimeout(function() {
            if (typeof DecapCMS !== 'undefined') {
              try {
                DecapCMS.init();
              } catch (error) {
                console.error('Decap CMS initialization error:', error);
              }
            }
          }, 200);
        };
        
        ulidScript.onerror = function() {
          // Failed to load ULID widget
          // Still try to initialize Decap CMS even if ULID widget fails
          setTimeout(function() {
            if (typeof DecapCMS !== 'undefined') {
              try {
                DecapCMS.init();
              } catch (error) {
                console.error('Decap CMS initialization error:', error);
              }
            }
          }, 200);
        };
        
        document.head.appendChild(ulidScript);
      };
      
      script.onerror = function() {
        console.error('Failed to load Decap CMS');
      };
      
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
